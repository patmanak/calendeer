name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-and-android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Install pinned Go toolchain
        run: |
          set -euo pipefail
          # SHA-256 from https://go.dev/dl/?mode=json&include=all.
          archive="$RUNNER_TEMP/go1.27.1.linux-amd64.tar.gz"
          curl --fail --location --retry 3 https://go.dev/dl/go1.27.1.linux-amd64.tar.gz --output "$archive"
          echo "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/calendeer-go"
          tar -xzf "$archive" -C "$RUNNER_TEMP/calendeer-go"
          echo "GOROOT=$RUNNER_TEMP/calendeer-go/go" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/calendeer-go/go/bin" >> "$GITHUB_PATH"
          echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
      - name: Install Android platform and pinned NDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Verify and build native crypto from source
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.1
          python3 proton-auth/native/golib/test-build.py
          python3 proton-auth/native/golib/test-package-aar.py
          native_source="$RUNNER_TEMP/calendeer-native-source"
          mkdir -p "$native_source"
          git archive HEAD:proton-auth/native/golib | tar -x -C "$native_source"
          bash "$native_source/build.sh" --go-home "$GOROOT" \
            --android-sdk "$ANDROID_HOME" --android-ndk "$ANDROID_NDK_HOME" \
            --java-home "$JAVA_HOME" --work "$RUNNER_TEMP/calendeer-native" \
            --repository "$GITHUB_WORKSPACE/proton-auth/native/build/maven"
      - name: Report native build fingerprints
        run: |
          elf="$RUNNER_TEMP/calendeer-native/arm64-v8a.so"
          go version -m "$elf"
          readelf -p .comment "$elf"
          objcopy="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy"
          for section in .text .rodata .gopclntab .go.buildinfo .data .note.go.buildid; do
            if "$objcopy" --dump-section "$section=$RUNNER_TEMP/section.dat" "$elf" "$RUNNER_TEMP/elf-copy" 2>/dev/null && test -s "$RUNNER_TEMP/section.dat"; then
              echo "$section $(sha256sum < "$RUNNER_TEMP/section.dat")"
              rm -f "$RUNNER_TEMP/section.dat"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, json, zipfile, zlib
          artifact, = Path('proton-auth/native/build/maven').rglob('*.aar')
          with zipfile.ZipFile(artifact) as archive:
              print('packaging zlib', zlib.ZLIB_RUNTIME_VERSION)
              for name in sorted(archive.namelist()):
                  if name.endswith(('.so', '.jar', '.json', '.xml')):
                      data = archive.read(name)
                      print(name, hashlib.sha256(data).hexdigest())
                      if name.endswith('provenance.json'):
                          for key, value in json.loads(data).items():
                              print(key, hashlib.sha256(json.dumps(value, sort_keys=True).encode()).hexdigest())
                      if name == 'classes.jar':
                          with zipfile.ZipFile(io.BytesIO(data)) as classes:
                              digest = hashlib.sha256()
                              for entry in sorted(classes.namelist()):
                                  digest.update(classes.read(entry))
                              print('uncompressed Java classes', digest.hexdigest())
          PY
      - name: Verify host suites, lint and APK builds
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --dependency-verification strict :sync:test :auth:test :proton-auth:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Verify dependency inventory and tooling
        run: |
          set -euo pipefail
          python3 -m pip install --only-binary=:all: --target "$RUNNER_TEMP/calendeer-workflow-python" -r tools/requirements.txt
          export PYTHONPATH="$RUNNER_TEMP/calendeer-workflow-python${PYTHONPATH:+:$PYTHONPATH}"
          python3 tools/validate_workflow.py
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_native_alignment.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
          python3 tools/dependency_audit.py
